plugins { id 'java' }

group = 'dev.littlegame'
version = '1.0.0'

java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

dependencies { compileOnly 'io.papermc.paper:paper-api:26.2.build.119-stable' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { filteringCharset = 'UTF-8'; filesMatching('plugin.yml') { expand(version: project.version) } }
